[workspace]
resolver = "2"
members = ["crates/cpm-core", "crates/cpm-py"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rand_core = "0.6"
rand_xoshiro = "0.6"
rand_distr = "0.4"
criterion = "0.5"
