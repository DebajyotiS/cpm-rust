[package]
name = "cpm-core"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
checker = []
# Prices the interface and adhesion terms in a single pass over the energy
# neighbourhood and reuses that pass's interface delta when booking an
# accepted move, rather than computing it twice. Produces the same
# floating-point result as the default path — see
# `energy::Terms::fused_conservative_delta`.
fused-energy = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
rand_core = { workspace = true }
rand_xoshiro = { workspace = true }
rand_distr = { workspace = true }
rand = "0.8"
rayon = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "monte_carlo"
harness = false

[[bench]]
name = "readouts"
harness = false

[[bench]]
name = "scale"
harness = false

[[bench]]
name = "topology"
harness = false
