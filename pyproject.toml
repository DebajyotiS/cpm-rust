[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "cpm"
version = "0.1.0"
description = "Cellular Potts Model tissue simulator (Rust core, Python bindings)"
requires-python = ">=3.9"
dependencies = ["numpy"]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "matplotlib>=3.9.4",
    "pytest>=8.0",
]

[tool.maturin]
manifest-path = "crates/cpm-py/Cargo.toml"
python-source = "python"
module-name = "cpm._cpm"
features = ["extension-module"]
